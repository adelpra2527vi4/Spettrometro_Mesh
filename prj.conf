CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="AS7341 Mesh Node"
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_HWINFO=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="AS7341 Light"
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_PRIVACY=n

CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_TX_SEG_MAX=10
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_GATT_PROXY=y
CONFIG_BT_MESH_PROXY_USE_DEVICE_NAME=y
CONFIG_BT_MESH_MODEL_EXTENSIONS=y
CONFIG_BT_MESH_MODEL_EXTENSION_LIST_SIZE=10
CONFIG_BT_MESH_SENSOR_SRV=y
CONFIG_BT_MESH_SENSOR_SRV_SENSORS_MAX=4
# Lo spettro (0xF341) ha 10 canali: il default (5) fa scrivere spec_value() oltre l'array
CONFIG_BT_MESH_SENSOR_CHANNELS_MAX=10
CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG_CHUNK_SIZE=12
CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG_CHUNK_COUNT=60
CONFIG_BT_MESH_TX_SEG_MSG_COUNT=3
CONFIG_BT_MESH_ACCESS_DELAYABLE_MSG_COUNT=10
CONFIG_BT_COMPANY_ID=0x0059
CONFIG_HWINFO=y

# Shell su USB CDC (reset locale: "node reset", stato: "node status")
CONFIG_SHELL=y
# Remote Provisioning Server: il nodo fa da ponte per provisionare altri nodi via mesh
CONFIG_BT_MESH_RPR_SRV=y
